[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[environment.env]

[[environment.mcp_servers]]
name = "salesforce"
transport = "streamable-http"
url = "http://salesforce:8000/mcp"
args = []
