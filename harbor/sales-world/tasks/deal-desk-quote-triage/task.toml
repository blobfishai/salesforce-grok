schema_version = "1.1"

[task]
name = "sales-world/deal-desk-quote-triage"
description = "Clear the deal desk approval queue against the discount and TCV matrix"
authors = [{ name = "salesforce-grok sales-world" }]
keywords = ["deal-desk", "cpq", "approvals", "policy"]

[metadata]
family = "deal-desk"
persona = "Deal Desk analyst"
difficulty = "medium"
citations = ["research/answers/stakeholder-roster.md#deal desk workflow approval matrix", "research/repos/eval/SalesforceAIResearch__CRMArena/run_tasks_crmarena_pro.sh"]

[verifier]
timeout_sec = 600.0

[verifier.env]
HARBOR_VERIFIER_TOKEN = "harbor-verifier-token"
