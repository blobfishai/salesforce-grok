schema_version = "1.1"

[task]
name = "sales-world/webhook-failure-triage"
description = "Quiet the failing integration without cutting the healthy ones"
authors = [{ name = "salesforce-grok sales-world" }]
keywords = ["integration", "webhook", "reliability", "triage"]

[metadata]
family = "integration-ops"
persona = "RevOps / integrations admin"
difficulty = "easy"
citations = ["research/parity/wcp/schema.frappe__crm.json", "research/answers/data-chaos-catalog.md"]

[verifier]
timeout_sec = 600.0

[verifier.env]
HARBOR_VERIFIER_TOKEN = "harbor-verifier-token"
WORLD_URL = "http://world:8080"

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[environment.env]

[[environment.mcp_servers]]
name = "salesforce"
transport = "streamable-http"
url = "http://salesforce:8000/mcp"
args = []
