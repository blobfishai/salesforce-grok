schema_version = "1.1"

[task]
name = "sales-world/stalled-pipeline-scrub-at-scale"
description = "Find the stalled six-figure deals worth chasing inside a 500-opportunity pipeline"
authors = [{ name = "salesforce-grok sales-world" }]
keywords = ["pipeline-inspection", "scale", "distractors", "cross-table", "long-horizon"]

[metadata]
family = "pipeline-inspection"
persona = "Sales Manager"
difficulty = "hard"
citations = ["research/answers/workflow-task-census.md#family 1", "research/answers/stakeholder-roster.md"]

[verifier]
timeout_sec = 600.0

[verifier.env]
HARBOR_VERIFIER_TOKEN = "harbor-verifier-token"
WORLD_URL = "http://world:8080"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[environment.env]

[[environment.mcp_servers]]
name = "salesforce"
transport = "streamable-http"
url = "http://salesforce:8000/mcp"
args = []
