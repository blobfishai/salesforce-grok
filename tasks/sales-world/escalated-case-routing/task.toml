schema_version = "1.1"

[task]
name = "sales-world/escalated-case-routing"
description = "Work the escalation queue: chase the urgent ones, unwind the ones that were over-escalated"
authors = [{ name = "salesforce-grok sales-world" }]
keywords = ["case-routing", "escalation", "sla", "triage"]

[metadata]
family = "support-routing"
persona = "Support Team Lead"
difficulty = "hard"
citations = ["research/answers/eval-task-census.md#CRMArena-Pro", "docs/anchors/wave2/10-case-management-sla.md"]

[verifier]
timeout_sec = 600.0

[verifier.env]
HARBOR_VERIFIER_TOKEN = "harbor-verifier-token"
WORLD_URL = "http://world:8080"

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[environment.env]

[[environment.mcp_servers]]
name = "salesforce"
transport = "streamable-http"
url = "http://salesforce:8000/mcp"
args = []
