schema_version = "1.1"

[task]
name = "sales-world/quote-to-order-activation"
description = "Activate every approved quote as an ERP sales order"
authors = [{ name = "salesforce-grok sales-world" }]
keywords = ["quote-to-cash", "erp", "order-activation", "multi-system"]

[metadata]
family = "quote-to-cash"
persona = "Revenue Operations"
difficulty = "hard"
citations = ["research/answers/sales-workflow-canon.md", "research/answers/data-chaos-catalog.md#where the same fact lives twice"]

[verifier]
timeout_sec = 600.0

[verifier.env]
HARBOR_VERIFIER_TOKEN = "harbor-verifier-token"
WORLD_URL = "http://world:8080"

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[environment.env]

[[environment.mcp_servers]]
name = "salesforce"
transport = "streamable-http"
url = "http://salesforce:8000/mcp"
args = []

[[environment.mcp_servers]]
name = "erp"
transport = "streamable-http"
url = "http://erp:8000/mcp"
args = []
